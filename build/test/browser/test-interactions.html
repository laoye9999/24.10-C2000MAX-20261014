<!doctype html><meta charset=utf-8><title>pending</title>
<body><pre id=out>pending</pre>
<script>
var log=[];
function say(s){log.push(s);document.getElementById('out').textContent=log.join('\n');}
var f=document.createElement('iframe');
f.style.cssText='width:1100px;height:900px;border:0';
f.src='/page.html';
document.body.appendChild(f);
f.onload=function(){ setTimeout(run, 6000); };

function nodes(d){ return d.querySelectorAll('.cbi-section-node[id^="cbi-homeproxy-cfg"]'); }
function hdr(d,i){ return nodes(d)[i].querySelector('.hp-node-head'); }
function box(d,i){ return nodes(d)[i].querySelector('.hp-node-body'); }
function txt(e){ return e? e.textContent : '<none>'; }

function snapshot(d,tag){
  var n=nodes(d);
  say('['+tag+'] nodes='+n.length);
  for(var i=0;i<n.length;i++){
    say('  name="'+txt(hdr(d,i).querySelector('.hp-node-name'))+'"'+
        ' type="'+txt(hdr(d,i).querySelector('.hp-node-type'))+'"'+
        ' addr="'+txt(hdr(d,i).querySelector('.hp-node-addr'))+'"'+
        ' tcp="'+txt(hdr(d,i).querySelector('.hp-node-tcp'))+'"'+
        ' open='+(box(d,i).style.display!=='none'));
  }
  var a=d.getElementById('hp-toggle-all');
  say('  toggleAll="'+(a?a.value:'<none>')+'"');
  say('  expanded='+[].some.call(n,function(_,i){return box(d,i).style.display!=='none';}));
}

function run(){
  try{
    var d=f.contentDocument;
    if(!d){ say('NO contentDocument'); return; }
    say('widgets built: '+d.querySelectorAll('[data-ui-widget]').length+' placeholders left');
    snapshot(d,'initial');

    var a=d.getElementById('hp-toggle-all');
    if(a){ a.click(); snapshot(d,'after toggle-all click'); a.click(); snapshot(d,'after second click'); }

    var h=hdr(d,0);
    h.click(); snapshot(d,'after clicking one header');
    h.click(); snapshot(d,'after clicking it again');

    var inp=d.querySelector('input[id^="widget.cbid.homeproxy."][id$=".name"]');
    if(inp){ inp.value='renamed-by-test';
      inp.dispatchEvent(new Event('change',{bubbles:true}));
      snapshot(d,'after renaming through the real input'); }
    else say('no text input found for name');
  }catch(e){ say('EXCEPTION: '+e); }
  document.title='done';
}
</script>
